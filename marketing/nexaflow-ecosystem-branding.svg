<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NexaFlow ecosystem branding</title>
  <desc id="desc">Dark monochrome NexaFlow ecosystem brand image showing one core infrastructure powering multiple business products.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".46" stop-color="#8a8a8a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#737373"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#030303"/>
  <g opacity=".45">
    <path d="M0 140h1600M0 260h1600M0 380h1600M0 500h1600M0 620h1600M0 740h1600" stroke="#111" stroke-width="1"/>
    <path d="M160 0v900M320 0v900M480 0v900M640 0v900M800 0v900M960 0v900M1120 0v900M1280 0v900M1440 0v900" stroke="#111" stroke-width="1"/>
  </g>
  <path d="M300 180C500 110 640 170 800 268C960 366 1100 424 1330 330" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <path d="M250 690C520 596 642 650 800 558C985 450 1116 584 1380 498" fill="none" stroke="#1d1d1d" stroke-width="2"/>

  <text x="800" y="95" text-anchor="middle" fill="#f5f5f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">NexaFlow</text>
  <text x="800" y="137" text-anchor="middle" fill="#8d8d8d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="7">ONE CORE. MANY BUSINESS PRODUCTS.</text>

  <g transform="translate(620 272)" filter="url(#shadow)">
    <circle cx="180" cy="180" r="178" fill="url(#coreGlow)"/>
    <circle cx="180" cy="180" r="120" fill="#080808" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="180" cy="180" r="84" fill="#0d0d0d" stroke="#555" stroke-width="1.5"/>
    <path d="M122 229V129h28v54l54-54h32v100h-28v-64l-58 64h-28Z" fill="url(#silver)"/>
    <path d="M130 198c36-12 62-32 85-66 18-26 35-39 56-42" fill="none" stroke="#f2f2f2" stroke-width="12" stroke-linecap="round"/>
    <text x="180" y="291" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Core Infrastructure</text>
    <text x="180" y="323" text-anchor="middle" fill="#8d8d8d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">users • billing • AI routing • logs • data</text>
  </g>

  <g stroke="#424242" stroke-width="1.6" fill="none">
    <path d="M800 452C675 452 602 335 470 300"/>
    <path d="M800 452C651 452 563 454 405 454"/>
    <path d="M800 452C675 452 604 574 470 610"/>
    <path d="M800 452C930 452 1004 335 1130 300"/>
    <path d="M800 452C950 452 1038 454 1195 454"/>
    <path d="M800 452C930 452 1004 574 1130 610"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(215 236)">
      <rect width="250" height="112" rx="14" fill="url(#panel)" stroke="#2d2d2d"/>
      <text x="126" y="48" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Enquiry</text>
      <text x="126" y="78" text-anchor="middle" fill="#9c9c9c" font-size="15">WhatsApp lead inbox</text>
    </g>
    <g transform="translate(150 398)">
      <rect width="250" height="112" rx="14" fill="url(#panel)" stroke="#2d2d2d"/>
      <text x="126" y="48" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">CRM</text>
      <text x="126" y="78" text-anchor="middle" fill="#9c9c9c" font-size="15">customers and follow-ups</text>
    </g>
    <g transform="translate(215 560)">
      <rect width="250" height="112" rx="14" fill="url(#panel)" stroke="#2d2d2d"/>
      <text x="126" y="48" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Automation</text>
      <text x="126" y="78" text-anchor="middle" fill="#9c9c9c" font-size="15">workflows and reminders</text>
    </g>
    <g transform="translate(1135 236)">
      <rect width="250" height="112" rx="14" fill="url(#panel)" stroke="#2d2d2d"/>
      <text x="126" y="48" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Billing</text>
      <text x="126" y="78" text-anchor="middle" fill="#9c9c9c" font-size="15">plans and subscriptions</text>
    </g>
    <g transform="translate(1200 398)">
      <rect width="250" height="112" rx="14" fill="url(#panel)" stroke="#2d2d2d"/>
      <text x="126" y="48" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Inventory</text>
      <text x="126" y="78" text-anchor="middle" fill="#9c9c9c" font-size="15">stock and service records</text>
    </g>
    <g transform="translate(1135 560)">
      <rect width="250" height="112" rx="14" fill="url(#panel)" stroke="#2d2d2d"/>
      <text x="126" y="48" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Dashboard</text>
      <text x="126" y="78" text-anchor="middle" fill="#9c9c9c" font-size="15">business visibility</text>
    </g>
  </g>

  <text x="800" y="820" text-anchor="middle" fill="#d8d8d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">A shared AI business operating system for local service merchants.</text>
</svg>
