<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexaFlow Promo Fancy 2</title>
  <style>
    :root {
      --bg: #030403;
      --panel: #0b0d0d;
      --line: #302a20;
      --text: #f7f7f5;
      --muted: #b8b0a1;
      --teal: #2dd4bf;
      --gold: #f3c76a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
    }
    .poster {
      width: 1600px;
      height: 900px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 54%, rgba(45,212,191,.24), transparent 32%),
        radial-gradient(circle at 88% 48%, rgba(243,199,106,.24), transparent 30%),
        linear-gradient(115deg, #020303 0%, #071112 48%, #140f07 100%);
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 92px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 92px);
      opacity: .48;
    }
    .flow {
      position: absolute;
      inset: auto -140px -40px -140px;
      height: 340px;
      opacity: .82;
      background:
        repeating-radial-gradient(ellipse at 18% 38%, rgba(45,212,191,.25) 0 1px, transparent 2px 18px),
        repeating-radial-gradient(ellipse at 82% 44%, rgba(243,199,106,.25) 0 1px, transparent 2px 18px);
      mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 74%, transparent 100%);
      transform: skewY(-5deg);
    }
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 640px;
      gap: 58px;
      align-items: center;
      padding: 74px 82px;
    }
    .eyebrow {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 5px;
      font-size: 17px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 64px;
      line-height: 1.02;
      margin: 0 0 24px;
      letter-spacing: 0;
      max-width: 780px;
    }
    .no-break {
      white-space: nowrap;
    }
    .lead {
      color: var(--muted);
      font-size: 30px;
      line-height: 1.38;
      max-width: 720px;
      margin: 0 0 34px;
    }
    .cta-row {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .cta {
      border-radius: 999px;
      padding: 18px 28px;
      background: linear-gradient(135deg, var(--gold), #ffffff);
      color: #070707;
      font-size: 22px;
      font-weight: 900;
    }
    .trial {
      color: #d8d8d8;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 17px 22px;
      font-size: 20px;
      background: rgba(255,255,255,.04);
    }
    .visual {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 620px;
    }
    .core {
      width: 300px;
      height: 300px;
      border: 1px solid rgba(243,199,106,.55);
      border-radius: 999px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 26%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(135deg, rgba(45,212,191,.18), rgba(243,199,106,.14)),
        #090909;
      box-shadow: 0 0 80px rgba(243,199,106,.14), 0 0 80px rgba(45,212,191,.12);
    }
    .core-mark {
      font-size: 132px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff, #c9c9c9 44%, var(--gold));
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
    }
    .module {
      position: absolute;
      width: 190px;
      min-height: 88px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.08), transparent 56%),
        rgba(11,13,13,.92);
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: 24px;
      font-weight: 850;
      box-shadow: 0 20px 50px rgba(0,0,0,.42);
    }
    .module:nth-child(2) { left: 0; top: 86px; border-color: rgba(45,212,191,.46); }
    .module:nth-child(3) { left: 0; bottom: 126px; border-color: rgba(45,212,191,.36); }
    .module:nth-child(4) { right: 0; top: 86px; border-color: rgba(243,199,106,.46); }
    .module:nth-child(5) { right: 0; bottom: 126px; border-color: rgba(243,199,106,.36); }
    .module:nth-child(6) { left: 225px; bottom: 0; border-color: rgba(255,255,255,.22); }
    .line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.62), transparent);
      transform-origin: center;
    }
    .l1 { width: 185px; left: 151px; top: 202px; transform: rotate(18deg); }
    .l2 { width: 182px; left: 151px; bottom: 224px; transform: rotate(-18deg); }
    .l3 { width: 185px; right: 151px; top: 202px; transform: rotate(-18deg); }
    .l4 { width: 182px; right: 151px; bottom: 224px; transform: rotate(18deg); }
    .l5 { width: 145px; left: 248px; bottom: 132px; transform: rotate(90deg); }
    .brand {
      position: absolute;
      top: 34px;
      left: 82px;
      font-size: 31px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .brand span {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="flow"></div>
    <div class="brand">Nexa<span>Flow</span></div>
    <section class="wrap">
      <div>
        <div class="eyebrow">AI business ecosystem</div>
        <h1>Turn enquiries into<br>organized <span class="no-break">follow-ups.</span></h1>
        <p class="lead">Start with NexaFlow Enquiry today, then grow into CRM, Billing, Inventory, and Automation from one shared core.</p>
        <div class="cta-row">
          <div class="cta">Start 30-day trial</div>
          <div class="trial">Built for local service merchants</div>
        </div>
      </div>
      <div class="visual" aria-label="NexaFlow ecosystem modules">
        <div class="core"><div class="core-mark">N</div></div>
        <div class="module">Enquiry</div>
        <div class="module">CRM</div>
        <div class="module">Billing</div>
        <div class="module">Inventory</div>
        <div class="module">Automation</div>
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="line l3"></div>
        <div class="line l4"></div>
        <div class="line l5"></div>
      </div>
    </section>
  </main>
</body>
</html>
